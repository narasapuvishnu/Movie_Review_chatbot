<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBot - AI Movie Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for parsing markdown in bot responses -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="logo">
                <span class="bot-icon">🎬</span>
                <div class="title-container">
                    <h1>CineBot</h1>
                    <p>Your AI Movie Expert</p>
                </div>
            </div>
            <div class="status">
                <span class="status-dot"></span> Online
            </div>
        </header>

        <main class="chat-box" id="chat-box">
            <div class="message bot">
                <div class="avatar">🎬</div>
                <div class="bubble">
                    <p>Hello! I'm CineBot. Ask me about any movie's budget, reviews, cast, or whether it was a hit or flop! 🍿</p>
                </div>
            </div>
        </main>

        <footer class="chat-input-area">
            <input type="text" id="user-input" placeholder="e.g. Was Avatar a hit or flop?..." autocomplete="off">
            <button id="send-btn" aria-label="Send Message">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
